##########################################
# Library Template Configuration
##########################################

template:
  id: com.wearily.library-template
  version: 1
  placeholder: Module

library:
  name: Module
  version: 1.0.0
  namespace: Module

qml:
  uri: com.wearily.Module
  version: 1.0
  plugin: ModulePlugin

resources:
  library: Module_resources.qrc
  shared: Module_share_resources.qrc

paths:
  include: include
  source: src
  qml: qml
  shaders: shaders
  share: share
  docs: docs
  examples: examples
  tests: tests

# Features means the /scripts/*.sh, *.bat, *.py will not locate the features with `false` value.
features:
  qml: true
  shaders: true
  docs: true
  examples: true
  tests: true
  install: true

build:
  qt_minimum: 5.15
  qt_preferred: 6.9

install:
  export: ModuleTargets
  config: ModuleConfig.cmake

license:
  spdx: MIT

metadata:
  author: Parsa Pournabi
  organization: wearily # In my case Wearily is my nickname :)
  created: 2026-08-01
